# REFERENCE COPY — the live config is inside the homeserver server block in
# /etc/nginx/sites-available/homeserver (edit that file, NOT a separate site).
#
# nextERP mobile app — https://192.168.0.9/luciatrading/
# Backend: Flask on 127.0.0.1:8347 (bin/python server.py)
# HTTP redirects to HTTPS; TLS is the mkcert cert in certs/ (see AGENTS.md).

    # luciatrading-begin (nextERP mobile app, backend on 127.0.0.1:8347)
    location = /luciatrading { return 308 https://$host$request_uri; }
    location /luciatrading/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8347/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /luciatrading;
        proxy_read_timeout 180s;
        client_max_body_size 5m;
    }
    # luciatrading-end
