# nextERP mobile app — http://192.168.0.9/luciatrading/
# Backend: Flask on 127.0.0.1:8347 (bin/python server.py)
server {
    listen 80;
    server_name 192.168.0.9;

    location = /luciatrading {
        return 301 /luciatrading/;
    }

    location /luciatrading/ {
        proxy_pass http://127.0.0.1:8347/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # PDF rendering can take several seconds
        proxy_connect_timeout 10s;
        client_max_body_size 5m;
    }
}
